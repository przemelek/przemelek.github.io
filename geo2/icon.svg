<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#112948"/>
      <stop offset="60%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    <linearGradient id="radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.35"/>
  
  <!-- Map Grid Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="10, 10" opacity="0.4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.5"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.65"/>
  
  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#0ea5e9" stroke-width="2.5" opacity="0.3"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#0ea5e9" stroke-width="2.5" opacity="0.3"/>

  <!-- Radar Sweep Slice -->
  <path d="M256,256 L383,129 A180,180 0 0,0 256,76 Z" fill="url(#radar)" opacity="0.25"/>

  <!-- Central Map Pin Beacon -->
  <path d="M256,150 C212,150 176,186 176,230 C176,290 256,365 256,365 C256,365 336,290 336,230 C336,186 300,150 256,150 Z" fill="url(#radar)" stroke="#ffffff" stroke-width="7"/>
  
  <!-- Pin Inner Hole / Center -->
  <circle cx="256" cy="228" r="32" fill="#080e1a" stroke="#ffffff" stroke-width="5"/>
  <circle cx="256" cy="228" r="16" fill="#22d3ee"/>

  <!-- Surrounding Landmark Points (Wiki Blue & Mapia Amber) -->
  <polygon points="140,160 170,175 155,205 125,190" fill="url(#accent)" stroke="#fff" stroke-width="3" opacity="0.9"/>
  <circle cx="365" cy="310" r="18" fill="#3b82f6" stroke="#fff" stroke-width="4"/>
  <text x="365" y="316" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">W</text>
  
  <circle cx="145" cy="340" r="16" fill="#f59e0b" stroke="#fff" stroke-width="3.5"/>
  <text x="145" y="345" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000" text-anchor="middle">M</text>

  <!-- Title Badge -->
  <rect x="156" y="400" width="200" height="44" rx="22" fill="#0e1726" stroke="#22d3ee" stroke-width="3"/>
  <text x="256" y="428" font-family="sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">GEO2</text>
</svg>